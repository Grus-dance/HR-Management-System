spring.application.name=HR-Management-System
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/hrm?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===== SQL init (schema.sql + data.sql) =====
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30

# ===== JSON =====
spring.jackson.time-zone=Asia/Shanghai

# ===== Upload / static =====
spring.web.resources.cache.period=0
spring.mvc.problemdetails.enabled=false

# ===== logging =====
logging.level.org.example=INFO
logging.level.org.example.mapper=DEBUG
