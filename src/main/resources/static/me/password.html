<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修改密码 · X 公司人事管理系统</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-title="修改密码">
<div class="app">
    <header class="topnav" id="topnav"></header>
    <main class="content">
            <div class="page-head">
                <div>
                    <h1>修改密码</h1>
                    <p class="page-desc">为保障账号安全，首次登录或重置密码后需要先修改密码</p>
                </div>
            </div>

            <div class="card" style="max-width: 520px;">
                <div class="card-body">
                    <form id="password-form" class="login-form" autocomplete="off">
                        <div class="field">
                            <label for="oldPassword">原密码</label>
                            <input id="oldPassword" type="password" required maxlength="32" autocomplete="current-password">
                        </div>
                        <div class="field">
                            <label for="newPassword">新密码</label>
                            <input id="newPassword" type="password" required minlength="6" maxlength="32"
                                   autocomplete="new-password">
                            <span class="form-hint">6-32 位，需同时包含字母和数字</span>
                        </div>
                        <div class="field">
                            <label for="confirmPassword">确认新密码</label>
                            <input id="confirmPassword" type="password" required minlength="6" maxlength="32"
                                   autocomplete="new-password">
                        </div>
                        <div class="form-error" id="password-error"></div>
                        <button class="btn btn-primary" type="submit" id="password-button">保存新密码</button>
                    </form>
                </div>
            </div>
        </main>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
    Layout.init().then((me) => {
        const form = document.getElementById('password-form');
        const errorBox = document.getElementById('password-error');
        const button = document.getElementById('password-button');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.textContent = '';
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (newPassword !== confirmPassword) {
                errorBox.textContent = '两次输入的新密码不一致';
                return;
            }
            if (!/^(?=.*[A-Za-z])(?=.*\d).+$/.test(newPassword)) {
                errorBox.textContent = '新密码需同时包含字母和数字';
                return;
            }
            button.disabled = true;
            try {
                await Api.put('/api/auth/password', { oldPassword, newPassword });
                UI.toast('密码修改成功', 'success');
                setTimeout(() => { location.href = Layout.home(me.role); }, 600);
            } catch (err) {
                errorBox.textContent = err.message || '修改失败';
                button.disabled = false;
            }
        });
    });
</script>
</body>
</html>
