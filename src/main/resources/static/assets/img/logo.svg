<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="X 公司人事管理系统">
    <defs>
        <linearGradient id="brand-gradient" x1="8" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FF9DB5"/>
            <stop offset="0.46" stop-color="#FB7299"/>
            <stop offset="1" stop-color="#00AEEC"/>
        </linearGradient>
        <linearGradient id="brand-shine" x1="10" y1="2" x2="34" y2="38" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
