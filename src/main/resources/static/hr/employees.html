<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>员工管理 · X 公司人事管理系统</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-title="员工管理">
<div class="app">
    <header class="topnav" id="topnav"></header>
    <main class="content">
            <div class="page-head">
                <div>
                    <h1>员工管理</h1>
                    <p class="page-desc">新建员工账号、重置密码、查看在职员工档案</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary" type="button" id="create-button">＋ 新建员工</button>
                </div>
            </div>

            <div class="card">
                <div class="filter-bar">
                    <div class="field grow search-input">
                        <label for="keyword">关键字</label>
                        <input id="keyword" type="text" placeholder="工号或姓名">
                    </div>
                    <div class="field">
                        <label for="department">部门</label>
                        <select id="department"><option value="">全部部门</option></select>
                    </div>
                    <button class="btn btn-primary" id="search-button" type="button">查询</button>
                </div>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr><th>工号</th><th>姓名</th><th>部门</th><th>职位</th><th>等级</th><th>入职日期</th><th class="actions">操作</th></tr>
                        </thead>
                        <tbody id="employee-body"><tr><td colspan="7"><div class="loading">加载中…</div></td></tr></tbody>
                    </table>
                </div>
                <div id="pager"></div>
            </div>
        </main>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/employee-detail.js"></script>
<script>
    Layout.init().then(async () => {
        const state = { page: 1, size: 10, keyword: '', department: '' };
        const body = document.getElementById('employee-body');
        const pager = document.getElementById('pager');
        let departments = [];
        let grades = [];

        try {
            departments = await Api.get('/api/dict/departments');
            grades = await Api.get('/api/hr/salary-grades');
            document.getElementById('department').innerHTML =
                '<option value="">全部部门</option>' +
                departments.map((d) => '<option value="' + UI.escapeHtml(d) + '">' + UI.escapeHtml(d) + '</option>').join('');
        } catch (err) { /* 字典加载失败不阻塞列表 */ }

        async function load() {
            body.innerHTML = '<tr><td colspan="7">' + UI.loading() + '</td></tr>';
            const query = new URLSearchParams({ page: state.page, size: state.size });
            if (state.keyword) query.set('keyword', state.keyword);
            if (state.department) query.set('department', state.department);
            try {
                const data = await Api.get('/api/hr/employees?' + query.toString());
                if (!data.list.length) {
                    body.innerHTML = UI.emptyRow(7, '没有符合条件的员工');
                } else {
                    body.innerHTML = data.list.map((employee) =>
                        '<tr><td class="num">' + UI.escapeHtml(employee.empNo) + '</td>' +
                        '<td><strong>' + UI.escapeHtml(employee.name) + '</strong></td>' +
                        '<td>' + UI.escapeHtml(employee.department) + '</td>' +
                        '<td>' + UI.escapeHtml(employee.position) + '</td>' +
                        '<td><span class="tag tag-blue">' + UI.escapeHtml(employee.gradeCode) + '</span></td>' +
                        '<td class="muted">' + UI.fmtDate(employee.hireDate) + '</td>' +
                        '<td class="actions"><button class="btn btn-sm" type="button" data-detail="' + employee.id + '">详情</button> ' +
                        '<button class="btn btn-sm btn-ghost" type="button" data-reset="' + employee.id + '" data-name="' + UI.escapeHtml(employee.name) + '">重置密码</button></td></tr>'
                    ).join('');
                    UI.$$('[data-detail]').forEach((button) => {
                        button.addEventListener('click', () => openDetail(Number(button.dataset.detail)));
                    });
                    UI.$$('[data-reset]').forEach((button) => {
                        button.addEventListener('click', () => resetPassword(Number(button.dataset.reset), button.dataset.name));
                    });
                }
                UI.renderPager(pager, {
                    total: data.total, page: data.page, size: data.size,
                    onChange: (page) => { state.page = page; load(); }
                });
            } catch (err) {
                body.innerHTML = UI.emptyRow(7, err.message);
            }
        }

        async function openDetail(id) {
            try {
                const detail = await Api.get('/api/hr/employees/' + id);
                UI.openModal({
                    title: '员工详情 · ' + detail.employee.name,
                    size: 'lg',
                    content: EmployeeDetail.render(detail),
                    footer: false
                });
            } catch (err) {
                UI.toast(err.message, 'error');
            }
        }

        async function resetPassword(id, name) {
            const ok = await UI.confirmDialog('确定将「' + name + '」的密码重置为初始密码 123456 吗？', { confirmText: '重置' });
            if (!ok) return;
            try {
                await Api.post('/api/hr/employees/' + id + '/reset-password');
                UI.toast('密码已重置为 123456，首次登录需修改', 'success');
            } catch (err) {
                UI.toast(err.message, 'error');
            }
        }

        function createFormHtml() {
            const departmentOptions = departments.map((d) =>
                '<option value="' + UI.escapeHtml(d) + '">' + UI.escapeHtml(d) + '</option>').join('');
            const gradeOptions = grades.map((g) =>
                '<option value="' + g.gradeCode + '">' + UI.escapeHtml(g.gradeCode) + ' ' + UI.escapeHtml(g.gradeName) +
                ' · ¥ ' + UI.money(g.baseSalary) + '</option>').join('');
            return '<div class="form-grid">' +
                '<div class="field"><label>员工编号<span class="req">*</span></label><input name="empNo" maxlength="16" placeholder="如 X1013"></div>' +
                '<div class="field"><label>姓名<span class="req">*</span></label><input name="name" maxlength="40"></div>' +
                '<div class="field"><label>性别<span class="req">*</span></label><select name="gender"><option value="M">男</option><option value="F">女</option></select></div>' +
                '<div class="field"><label>出生日期</label><input name="birthDate" type="date"></div>' +
                '<div class="field"><label>身份证号</label><input name="idCard" maxlength="18"></div>' +
                '<div class="field"><label>手机号</label><input name="phone" maxlength="11"></div>' +
                '<div class="field"><label>邮箱</label><input name="email" type="email" maxlength="80"></div>' +
                '<div class="field"><label>部门<span class="req">*</span></label><select name="department">' + departmentOptions + '</select></div>' +
                '<div class="field"><label>职位<span class="req">*</span></label><input name="position" maxlength="40"></div>' +
                '<div class="field"><label>薪酬等级<span class="req">*</span></label><select name="gradeCode">' + gradeOptions + '</select></div>' +
                '<div class="field"><label>入职日期<span class="req">*</span></label><input name="hireDate" type="date"></div>' +
                '<div class="field"><label>学历</label><input name="education" maxlength="20" placeholder="如 本科 / 硕士"></div>' +
                '<div class="field"><label>毕业院校</label><input name="school" maxlength="80"></div>' +
                '<div class="field"><label>专业</label><input name="major" maxlength="80"></div>' +
                '<div class="field"><label>紧急联系人</label><input name="emergencyContact" maxlength="40"></div>' +
                '<div class="field"><label>紧急联系电话</label><input name="emergencyPhone" maxlength="11"></div>' +
                '<div class="field span-2"><label>住址</label><input name="address" maxlength="200"></div>' +
                '</div>' +
                '<p class="form-hint" style="margin-top:12px">创建后系统自动生成登录账号，初始密码为 123456，首次登录需修改密码。</p>';
        }

        document.getElementById('create-button').addEventListener('click', () => {
            const handle = UI.openModal({ title: '新建员工', size: 'lg', content: createFormHtml() });

            const cancel = document.createElement('button');
            cancel.className = 'btn';
            cancel.type = 'button';
            cancel.textContent = '取消';
            cancel.addEventListener('click', handle.close);

            const submit = document.createElement('button');
            submit.className = 'btn btn-primary';
            submit.type = 'button';
            submit.textContent = '创建并生成账号';
            submit.addEventListener('click', async () => {
                const form = handle.body;
                const value = (name) => {
                    const el = form.querySelector('[name="' + name + '"]');
                    return el && el.value.trim() ? el.value.trim() : null;
                };
                const payload = {
                    empNo: value('empNo'), name: value('name'), gender: value('gender'),
                    birthDate: value('birthDate'), idCard: value('idCard'), phone: value('phone'),
                    email: value('email'), department: value('department'), position: value('position'),
                    gradeCode: value('gradeCode'), hireDate: value('hireDate'), education: value('education'),
                    school: value('school'), major: value('major'), address: value('address'),
                    emergencyContact: value('emergencyContact'), emergencyPhone: value('emergencyPhone')
                };
                submit.disabled = true;
                try {
                    await Api.post('/api/hr/employees', payload);
                    UI.toast('员工创建成功，初始密码 123456', 'success');
                    handle.close();
                    state.page = 1;
                    load();
                } catch (err) {
                    UI.toast(err.message, 'error');
                    submit.disabled = false;
                }
            });

            handle.foot.appendChild(cancel);
            handle.foot.appendChild(submit);
        });

        document.getElementById('search-button').addEventListener('click', () => {
            state.keyword = document.getElementById('keyword').value.trim();
            state.department = document.getElementById('department').value;
            state.page = 1;
            load();
        });
        document.getElementById('keyword').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') document.getElementById('search-button').click();
        });

        load();
    });
</script>
</body>
</html>
